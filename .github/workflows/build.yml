name: Build Executables

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.0.0，留空则取 tag）"
        required: false
        default: ""

permissions:
  contents: write   # 打 v* 标签时自动创建 Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12：PyQt5/PyQtWebEngine 是 abi3 wheel，3.11~3.13 均可；
          # 该版本在 PyInstaller 上支持度最稳
          python-version: "3.12"
          cache: pip          # 由 setup-python 统一缓存，Windows/Linux 路径差异自动处理

      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libnss3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller study-manager.spec --clean --noconfirm

      - name: Smoke test (Linux, offscreen)
        if: runner.os == 'Linux'
        run: |
          # 启动 15 秒后由 timeout 杀掉（退出码 124）视为启动成功；
          # 若因缺库/缺资源提前退出，则视为失败
          xvfb-run -a bash -c 'timeout 15 ./dist/study-manager/study-manager; test $? -eq 124 && echo SMOKE-OK || echo SMOKE-FAIL'

      - name: Verify artifact structure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Test-Path ./dist/study-manager/study-manager.exe | Out-String | Write-Host
          if (!(Test-Path ./dist/study-manager/study-manager.exe)) { exit 1 }

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Package archive
        shell: bash
        run: |
          cd dist
          mv study-manager study-manager-${{ matrix.platform }}-x64
          tar -czf study-manager-${{ steps.version.outputs.version }}-${{ matrix.platform }}-x64.tar.gz study-manager-${{ matrix.platform }}-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-manager-${{ steps.version.outputs.version }}-${{ matrix.platform }}-x64
          path: dist/study-manager-${{ steps.version.outputs.version }}-${{ matrix.platform }}-x64.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # 仅打 v* 标签时发布
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*/*.tar.gz \
            --title "学习管理 $GITHUB_REF_NAME" \
            --notes "自动构建产物，适用于 Windows / Linux x64。解压后运行 study-manager(.exe)。"